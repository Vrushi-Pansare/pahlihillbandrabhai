# ---------------------------------------------------------------------------
# 301 redirects: old WordPress site  ->  new Angular routes / menu PDFs
#
# Install:  copy to /etc/nginx/snippets/pahlihill-redirects.conf  and add
#           `include snippets/pahlihill-redirects.conf;`  inside the
#           `server { ... }` block for pahlihillbandrabhai.com (and www).
#           deploy.sh does this automatically.
#
# These are anchored regex matches, so they take precedence over the SPA
# `try_files ... /index.html` fallback. Anything not listed keeps serving
# the app unchanged. $scheme://$host keeps the visitor on the same
# host/protocol (no extra hop through a www<->apex redirect).
# ---------------------------------------------------------------------------

# --- Core pages --------------------------------------------------------------
location ~ ^/london-restaurant/?$        { return 301 $scheme://$host/about; }
location ~ ^/london-restaurant-menus/?$  { return 301 $scheme://$host/; }
location ~ ^/bandra-bhai/?$              { return 301 $scheme://$host/speakeasy; }
location ~ ^/reservation/?$              { return 301 $scheme://$host/; }

# --- Private / group dining ------------------------------------------------
location ~ ^/group-dining-[a-z0-9-]+/?$  { return 301 $scheme://$host/private-hires; }
location ~ ^/whats-on/chefs-counter/?$   { return 301 $scheme://$host/private-hires; }

# --- Menu pages -> current menu PDFs -------------------------------------
location ~ ^/bandra-bhai-menu/?$ {
  return 301 https://cshare-leader-prod-new.s3.ap-south-1.amazonaws.com/2026-08-19T14:57:12.464Z/WineandSpirit.pdf;
}
location ~ ^/(whats-on/)?the-pahli-hill-tasting-menu/?$ {
  return 301 https://cshare-leader-prod-new.s3.ap-south-1.amazonaws.com/2026-08-20T11:25:57.280Z/SELECTMenus.pdf;
}
location ~ ^/(whats-on/)?weekday-lunch-at-pahli-hill/?$ {
  return 301 https://cshare-leader-prod-new.s3.ap-south-1.amazonaws.com/2026-08-19T14:49:05.873Z/LunchMenu.pdf;
}
location ~ ^/whats-on/set-lunch-menu-pahli-hill/?$ {
  return 301 https://cshare-leader-prod-new.s3.ap-south-1.amazonaws.com/2026-08-19T14:49:05.873Z/LunchMenu.pdf;
}
location ~ ^/whats-on/saturday-lunch/?$ {
  return 301 https://cshare-leader-prod-new.s3.ap-south-1.amazonaws.com/2026-08-19T14:49:05.873Z/LunchMenu.pdf;
}
location ~ ^/whats-on/new-years-day-lunch/?$ {
  return 301 https://cshare-leader-prod-new.s3.ap-south-1.amazonaws.com/2026-08-19T14:49:05.873Z/LunchMenu.pdf;
}

# --- Old menu PDFs (WordPress uploads) -> current menu PDFs ------------
location ~ ^/wp-content/uploads/2025/11/Wine-and-Spirits-16\.07\.25\.pdf$ {
  return 301 https://cshare-leader-prod-new.s3.ap-south-1.amazonaws.com/2026-08-19T14:57:12.464Z/WineandSpirit.pdf;
}
location ~* ^/wp-content/uploads/2025/12/FOH-BOH-ALL-SOPs.*\.pdf$ {
  return 301 https://cshare-leader-prod-new.s3.ap-south-1.amazonaws.com/2026-08-19T14:37:34.449Z/Allergens28thJuly2026.pdf;
}

# --- What's-on hub, gifting, careers, WP taxonomy: no equivalent -> home
location ~ ^/whats-on(/.*)?$        { return 301 $scheme://$host/; }
location ~ ^/gifting-experiences/?$ { return 301 $scheme://$host/; }
location ~ ^/careers/?$             { return 301 $scheme://$host/; }
location ~ ^/privacy-policy/?$      { return 301 $scheme://$host/; }
location ~ ^/(category|author|tag)/ { return 301 $scheme://$host/; }

# --- Kill leftover WordPress surface (never index these) --------------
location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json|wp-content|wp-includes)(/|$) {
    return 410;
}
