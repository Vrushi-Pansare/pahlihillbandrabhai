# ---------------------------------------------------------------------------
# Preview site: https://preview.pahlihillbandrabhai.com
#
# Install (one-time) as /etc/nginx/sites-available/preview.pahlihillbandrabhai.com,
# symlink into sites-enabled, then let certbot add the TLS block:
#     sudo certbot --nginx -d preview.pahlihillbandrabhai.com
#
# Independent of the production vhost and web root. Publish with
# ./deploy-preview.sh (never touches /var/www/pahlihillbandrabhai.com).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name preview.pahlihillbandrabhai.com;

    root /var/www/preview.pahlihillbandrabhai.com;
    index index.html;

    # Keep the preview out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|mp4)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The menu API only allows CORS from the production origin, so the preview
    # calls it same-origin through this proxy (see constants.ts). Only the
    # listing endpoints are exposed.
    location ^~ /al-chef-api/public/listing {
        proxy_pass https://al-chef.netraax.com/api/v1/public/listing;
        proxy_ssl_server_name on;
        proxy_set_header Host al-chef.netraax.com;
        proxy_set_header Origin "";
        proxy_read_timeout 30s;
    }
}
