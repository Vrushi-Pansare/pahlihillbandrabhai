[build]
  publish = "dist/pahlihillbandrabhai/browser"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22.22.0"
  NETLIFY_SKIP_ANGULAR_PLUGIN = "true"

# Long-lived immutable caching for media assets so repeat visits don't
# re-download the hero videos/images.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

